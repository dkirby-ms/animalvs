services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: animalvs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: animalvs_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - player-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalvs -d animalvs_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  player-data:
