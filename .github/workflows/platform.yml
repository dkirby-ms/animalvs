name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: animalvs
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: animalvs_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animalvs -d animalvs_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://animalvs:ci-local-only@127.0.0.1:5432/animalvs_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:production
